<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saga :: M. Amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="landing">
        <!-- Clouds on day/India side (left) -->
        <div class="clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- Sun on day side (top-left) -->
        <div class="sun"></div>

        <!-- Stars on night/Mexico side (right) -->
        <div class="stars" id="stars"></div>

        <!-- Moon on night side (top-right) -->
        <div class="moon"></div>

        <!-- India map (LEFT - Day) -->
        <div class="side side-left">
            <img src="india.svg" alt="India" class="map-img map-india">
        </div>

        <!-- Flight Route (CENTER) -->
        <div class="flight-center">
            <svg class="route-svg" viewBox="0 0 300 160" preserveAspectRatio="xMidYMid meet">
                <path d="M10,130 C50,130 70,25 150,25 C230,25 250,130 290,130" 
                      fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" 
                      stroke-dasharray="12,8" class="dash-path"/>
                <!-- Small loops -->
                <circle cx="85" cy="52" r="10" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="5,4"/>
                <circle cx="215" cy="52" r="10" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="5,4"/>
            </svg>
            <!-- Ticket SVG icon -->
            <div class="tickets">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="18" width="56" height="28" rx="4" fill="white" opacity="0.85"/>
                    <rect x="4" y="18" width="56" height="28" rx="4" stroke="white" stroke-width="1"/>
                    <line x1="44" y1="18" x2="44" y2="46" stroke="#aaa" stroke-dasharray="3,2"/>
                    <circle cx="20" cy="32" r="6" fill="#87CEEB"/>
                    <path d="M18,30 L22,30 L20,34 Z" fill="white"/>
                    <rect x="30" y="26" width="10" height="2" rx="1" fill="#ccc"/>
                    <rect x="30" y="30" width="8" height="2" rx="1" fill="#ccc"/>
                    <rect x="30" y="34" width="12" height="2" rx="1" fill="#ccc"/>
                    <text x="48" y="35" font-size="10" fill="#555" font-family="sans-serif">&#9992;</text>
                </svg>
            </div>
        </div>

        <!-- Mexico map (RIGHT - Night) -->
        <div class="side side-right">
            <img src="mexico.svg" alt="Mexico" class="map-img map-mexico">
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
