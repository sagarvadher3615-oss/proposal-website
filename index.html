<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saga :: M. Amor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="landing">
        <!-- Clouds on day/Mexico side (left) -->
        <div class="clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- Sun on day side (top-left area) -->
        <div class="sun"></div>

        <!-- Stars on night/India side (right) -->
        <div class="stars" id="stars"></div>

        <!-- Mexico map (LEFT - Day) -->
        <div class="side side-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Mexico_blank_color_map.svg" alt="Mexico Map" class="map-img map-mexico">
        </div>

        <!-- Flight Route (CENTER) -->
        <div class="flight-center">
            <svg class="route-svg" viewBox="0 0 300 150" preserveAspectRatio="xMidYMid meet">
                <!-- Dashed curved path -->
                <path d="M20,120 C60,120 80,30 150,30 C220,30 240,120 280,120" 
                      fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" 
                      stroke-dasharray="12,8" class="dash-path"/>
                <!-- Small loop/circles along route -->
                <circle cx="90" cy="55" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>
                <circle cx="210" cy="55" r="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>
                <!-- Location pin at start -->
                <path d="M148,18 a6,6 0 1,0 4,0 a6,6 0 1,0 -4,0" fill="rgba(255,255,255,0.6)"/>
                <path d="M150,25 L150,32" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
            </svg>
            <!-- Tickets icon -->
            <div class="tickets">🎫✈️</div>
        </div>

        <!-- India map (RIGHT - Night) -->
        <div class="side side-right">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/India_States_and_UT_-_blank_map.svg" alt="India Map" class="map-img map-india">
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
